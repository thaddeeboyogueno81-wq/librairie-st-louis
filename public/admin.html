<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | Saint Louis</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="loader" id="loader"><div class="loader-box"><img class="loader-logo" src="/assets/logo.svg"><div class="spinner"></div></div></div><div class="toast" id="toast"></div>
<nav class="nav"><div class="container nav-inner"><a class="brand" href="/"><img src="/assets/logo.svg"></a><span style="margin-left:auto;font-weight:800">Espace gérant</span></div></nav>
<main><section class="page-head"><div class="container"><h1>Tableau de bord</h1><p>Gérez le catalogue et suivez les commandes.</p></div></section><section class="section" style="padding-top:20px"><div class="container" id="admin"></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:0;margin:0">Administration · Site réalisé par <strong>Thaddée Isaac Boyoguéno</strong>.</div></div></footer>
<script src="/app.js"></script><script>
let editing=null;
async function me(){const r=await fetch("/api/auth/me");return (await r.json()).authenticated}
function login(){const box=$("#admin");box.innerHTML=`<div class="form-card" style="max-width:480px;margin:auto"><h2>Connexion gérant</h2><form id="login"><div class="field"><label>Utilisateur</label><input name="username" value="admin" required></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input name="password" type="password" required></div><button class="btn btn-primary" style="margin-top:18px;width:100%">Se connecter</button></form></div>`;$("#login").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok){showToast(d.error);return}dashboard()}}
async function dashboard(){const [products,orders]=await Promise.all([fetch("/api/products").then(r=>r.json()),fetch("/api/admin/orders").then(r=>r.json())]);if(!Array.isArray(orders)){login();return}
$("#admin").innerHTML=`<div class="kpis"><div class="kpi"><span>Produits</span><strong>${products.length}</strong></div><div class="kpi"><span>Commandes</span><strong>${orders.length}</strong></div><div class="kpi"><span>En livraison</span><strong>${orders.filter(o=>o.status==="out_for_delivery").length}</strong></div></div><div class="admin-grid"><aside class="admin-side"><h2 id="formTitle">Ajouter un produit</h2><form id="productForm"><div class="field"><label>Nom *</label><input name="name" required></div><div class="field"><label>Catégorie *</label><input name="category" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Prix (FCFA)</label><input name="price" type="number" min="0" placeholder="Laisser vide si à confirmer"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>Image du produit</label><input name="image" placeholder="/assets/hero.jpg ou URL"><input id="imageFile" type="file" accept="image/*"></div><label style="display:flex;gap:8px;margin:12px 0"><input name="featured" type="checkbox"> Mettre en avant</label><div class="admin-actions"><button class="btn btn-primary">Enregistrer</button><button class="btn btn-light" type="button" id="cancelEdit" style="display:none">Annuler</button></div></form><div class="hours-admin"><h2>Horaires</h2><p class="muted">Renseignez les horaires qui seront affichés sur le site public.</p><form id="hoursForm">${DAYS.map(([key,label])=>`<div class="field"><label>${label}</label><input name="${key}" placeholder="Ex. 08:00 – 18:00 ou Fermé"></div>`).join("")}<button class="btn btn-primary" style="width:100%;margin-top:12px">Enregistrer les horaires</button></form></div><div class="hours-admin"><h2>Commerce & commandes</h2><form id="businessForm"><div class="field"><label>WhatsApp (numéro international)</label><input name="whatsapp" placeholder="237699242376"></div><div class="field"><label>Téléphone affiché</label><input name="phone"></div><div class="field"><label>Adresse</label><input name="address"></div><div class="field"><label>Repère</label><input name="landmark"></div><div class="field"><label>Frais de livraison (FCFA)</label><input name="deliveryFee" type="number" min="0"></div><div class="field"><label>Livraison gratuite à partir de (FCFA)</label><input name="freeDeliveryFrom" type="number" min="0"></div><label><input name="deliveryEnabled" type="checkbox"> Livraison active</label><br><label><input name="pickupEnabled" type="checkbox"> Retrait boutique actif</label><button class="btn btn-primary" style="width:100%;margin-top:12px">Enregistrer</button></form></div><div class="hours-admin"><h2>Sécurité</h2><form id="passwordForm"><div class="field"><label>Mot de passe actuel</label><input name="currentPassword" type="password" required></div><div class="field"><label>Nouveau mot de passe</label><input name="newPassword" type="password" minlength="10" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Changer le mot de passe</button></form><button class="btn btn-light" id="backup" style="width:100%;margin-top:10px">Télécharger une sauvegarde</button></div><button class="btn btn-light" id="logout" style="width:100%;margin-top:15px">Déconnexion</button></aside><section class="admin-main"><h2>Produits</h2><div class="admin-list" id="productList">${products.map(p=>`<div class="admin-item"><div><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.category)} · ${money(p.price)}</small></div><div class="admin-actions"><button class="mini" data-edit="${p.id}">Modifier</button><button class="mini" data-del="${p.id}">Masquer</button></div></div>`).join("")}</div><h2 style="margin-top:35px">Commandes</h2><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Client</th><th>Articles</th><th>Statut</th><th>Date</th></tr></thead><tbody>${orders.map(o=>`<tr><td><strong>${escapeHtml(o.code)}</strong></td><td>${escapeHtml(o.customer_name)}<br><small>${escapeHtml(o.phone)}<br>${escapeHtml(o.address)}<br><a class="mini" target="_blank" rel="noopener" href="https://wa.me/237699242376?text=${encodeURIComponent('Bonjour, nouvelle commande '+o.code+' de '+o.customer_name+'.')}">WhatsApp</a></small></td><td>${o.items.map(i=>`${i.quantity}× ${escapeHtml(i.product_name)}`).join("<br>")}</td><td><select class="status-select" data-status="${o.id}">${["pending","confirmed","preparing","out_for_delivery","delivered","received"].map(s=>`<option value="${s}" ${s===o.status?"selected":""}>${formatStatus(s)}</option>`).join("")}</select></td><td>${new Date(o.created_at.replace(" ","T")+"Z").toLocaleString("fr-FR")}</td></tr>`).join("")}</tbody></table></div></section></div>`;
const form=$("#productForm");
const hoursForm=$("#hoursForm");
try { const hr=await fetch("/api/settings/hours"); const hours=await hr.json(); DAYS.forEach(([key])=>hoursForm[key].value=hours[key]||""); } catch {}
hoursForm.onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(hoursForm));const r=await fetch("/api/admin/settings/hours",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok){showToast(d.error||"Impossible d'enregistrer les horaires.");return}showToast("Horaires enregistrés.");};
const businessForm=$("#businessForm"); try{const br=await fetch('/api/settings/business');const b=await br.json();Object.entries(b).forEach(([k,v])=>{if(businessForm[k]){if(businessForm[k].type==='checkbox')businessForm[k].checked=Boolean(v);else businessForm[k].value=v??''}})}catch{}
businessForm.onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(businessForm));p.deliveryEnabled=businessForm.deliveryEnabled.checked;p.pickupEnabled=businessForm.pickupEnabled.checked;p.deliveryFee=Number(p.deliveryFee||0);p.freeDeliveryFrom=Number(p.freeDeliveryFrom||0);p.paymentMethods=['Paiement à la livraison','Paiement au retrait en boutique'];const r=await fetch('/api/admin/settings/business',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();showToast(r.ok?'Paramètres enregistrés.':d.error||'Erreur.')};
$("#passwordForm").onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/security/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok){showToast(d.error);return}showToast('Mot de passe changé.');e.target.reset()};
$("#backup").onclick=()=>{window.location.href='/api/admin/backup'};
$$("[data-edit]").forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id==b.dataset.edit);editing=p.id;form.name.value=p.name;form.category.value=p.category;form.description.value=p.description;form.price.value=p.price??"";form.stock.value=p.stock;form.image.value=p.image?.startsWith("data:")?"":p.image;form.featured.checked=p.featured;$("#imageFile").value="";$("#formTitle").textContent="Modifier le produit";$("#cancelEdit").style.display="inline-flex"});
$("#cancelEdit").onclick=()=>{editing=null;form.reset();form.stock.value=0;$("#formTitle").textContent="Ajouter un produit";$("#cancelEdit").style.display="none"};
$$("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Masquer ce produit ?"))return;await fetch("/api/products/"+b.dataset.del,{method:"DELETE"});dashboard()});
$$("[data-status]").forEach(s=>s.onchange=async()=>{await fetch("/api/admin/orders/"+s.dataset.status+"/status",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s.value})});showToast("Statut mis à jour.")});
$("#logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST"});login()};
form.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form));b.featured=form.featured.checked;b.price=b.price===""?null:Number(b.price);b.stock=Number(b.stock||0);const file=$("#imageFile").files[0];if(file){if(file.size>2*1024*1024){showToast("Image trop lourde (2 Mo max).");return}b.image=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)})}if(!b.image)b.image="/assets/hero.jpg";const url=editing?"/api/products/"+editing:"/api/products";const r=await fetch(url,{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok){showToast(d.error);return}showToast(editing?"Produit modifié.":"Produit ajouté.");editing=null;dashboard()};
}
me().then(ok=>ok?dashboard():login());
</script></body></html>
