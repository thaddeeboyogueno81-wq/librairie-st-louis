<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ae70"><meta property="og:site_name" content="Librairie Papeterie Saint Louis"><meta property="og:locale" content="fr_CM"><title>Catalogue | Saint Louis</title><meta name="description" content="Catalogue de produits de la Librairie Papeterie Saint Louis à Yaoundé."><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="loader" id="loader"><div class="loader-box"><img class="loader-logo" src="/assets/logo.svg"><div class="spinner"></div></div></div><div class="route-overlay" id="routeOverlay"><div class="spinner"></div></div><div class="toast" id="toast"></div>
<nav class="nav"><div class="container nav-inner"><a class="brand transition-link" href="/"><img src="/assets/logo.svg"></a><button class="menu-btn" id="menuBtn">☰</button><div class="navlinks" id="navLinks"><a class="transition-link" href="/">Accueil</a><a class="active transition-link" href="/catalogue.html">Catalogue</a><a class="transition-link" href="/suivi.html">Suivre une commande</a><a class="cart-pill transition-link" href="/panier.html">Panier <span class="count cart-count">0</span></a></div></div></nav>
<main><section class="page-head"><div class="container"><h1>Notre catalogue</h1><p>Recherchez un livre, un dictionnaire, un manuel ou un article de papeterie.</p></div></section>
<section class="section" style="padding-top:20px"><div class="container"><div class="catalog-toolbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Rechercher un article…"></div><select id="category" class="select"><option value="">Toutes les catégories</option></select></div><div id="products" class="product-grid"></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:0;margin:0">Site réalisé par <strong>Thaddée Isaac Boyoguéno</strong> · Librairie Papeterie Saint Louis · Yaoundé.</div></div></footer>
<a class="whatsapp-float" data-whatsapp="Bonjour, je souhaite avoir des informations sur vos produits." target="_blank" rel="noopener" aria-label="Contacter la librairie sur WhatsApp">WhatsApp</a><script src="/app.js"></script><script>
let all=[];
function render(items){const box=document.querySelector("#products");if(!items.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">Aucun article ne correspond à votre recherche.</div>';return}
box.innerHTML=items.map(p=>`<article class="product"><div class="product-img"><img src="${p.image}" alt="${escapeHtml(p.name)}"></div><div class="product-body"><span class="tag">${escapeHtml(p.category)}</span><h3>${escapeHtml(p.name)}</h3><p class="muted">${escapeHtml(p.description)}</p><div class="price ${p.price==null?'pending':''}">${money(p.price)}</div><button class="btn btn-secondary" data-add="${p.id}">Ajouter au panier</button></div></article>`).join("");
$$("[data-add]",box).forEach(b=>b.onclick=()=>addToCart(all.find(p=>p.id==b.dataset.add)));
}
async function load(){all=await fetch("/api/products").then(r=>r.json());render(all);const cats=await fetch("/api/products/categories").then(r=>r.json());document.querySelector("#category").innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${escapeHtml(c)}</option>`).join("")}
function filter(){const q=document.querySelector("#search").value.toLowerCase(),c=document.querySelector("#category").value;render(all.filter(p=>(!q||(p.name+" "+p.category+" "+p.description).toLowerCase().includes(q))&&(!c||p.category===c)))}
document.querySelector("#search").oninput=filter;document.querySelector("#category").onchange=filter;load();
</script></body></html>
