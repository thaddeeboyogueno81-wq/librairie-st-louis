<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ae70"><meta property="og:site_name" content="Librairie Papeterie Saint Louis"><meta property="og:locale" content="fr_CM"><title>Commande | Saint Louis</title><meta name="description" content="Passez votre commande auprès de la Librairie Papeterie Saint Louis à Yaoundé."><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="loader" id="loader"><div class="loader-box"><img class="loader-logo" src="/assets/logo.svg"><div class="spinner"></div></div></div><div class="route-overlay" id="routeOverlay"><div class="spinner"></div></div><div class="toast" id="toast"></div>
<nav class="nav"><div class="container nav-inner"><a class="brand transition-link" href="/"><img src="/assets/logo.svg"></a><button class="menu-btn" id="menuBtn">☰</button><div class="navlinks" id="navLinks"><a class="transition-link" href="/">Accueil</a><a class="transition-link" href="/catalogue.html">Catalogue</a><a class="transition-link" href="/suivi.html">Suivre une commande</a><a class="cart-pill transition-link" href="/panier.html">Panier <span class="count cart-count">0</span></a></div></div></nav>
<main><section class="page-head"><div class="container"><h1>Passer la commande</h1><p>Indiquez vos coordonnées et l'adresse où vous souhaitez être livré.</p></div></section><section class="section" style="padding-top:20px"><div class="container"><div id="checkout"></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:0;margin:0">Site réalisé par <strong>Thaddée Isaac Boyoguéno</strong>.</div></div></footer>
<a class="whatsapp-float" data-whatsapp="Bonjour, je souhaite avoir des informations sur vos produits." target="_blank" rel="noopener" aria-label="Contacter la librairie sur WhatsApp">WhatsApp</a><script src="/app.js"></script><script>
async function loadCheckout(){const c=cart();if(!c.length){location.href='/panier.html';return}let total=0,unknown=false;c.forEach(x=>{if(x.price==null)unknown=true;else total+=x.price*x.quantity});let b={deliveryEnabled:true,pickupEnabled:true,deliveryFee:0,freeDeliveryFrom:0,paymentMethods:['Paiement à la livraison','Paiement au retrait en boutique']};try{const r=await fetch('/api/settings/business');if(r.ok)b=await r.json()}catch{}const modes=[];if(b.deliveryEnabled)modes.push('<label class="choice"><input type="radio" name="fulfillment" value="delivery" checked> Livraison à Yaoundé</label>');if(b.pickupEnabled)modes.push('<label class="choice"><input type="radio" name="fulfillment" value="pickup"> Retrait en boutique</label>');const payments=(b.paymentMethods||[]).map((x,i)=>`<option ${i===0?'selected':''}>${escapeHtml(x)}</option>`).join('');const fee=Number(b.deliveryFee||0);$('#checkout').innerHTML=`<div class="checkout-layout"><form class="form-card" id="orderForm"><h2>Informations de commande</h2><div class="form-grid"><div class="field"><label>Nom complet *</label><input name="customer_name" required placeholder="Votre nom"></div><div class="field"><label>Téléphone *</label><input name="phone" required placeholder="6xx xx xx xx"></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="facultatif"></div><div class="field"><label>Ville</label><input value="Yaoundé" disabled></div><div class="field full"><label>Mode de réception *</label><div class="choices">${modes.join('')}</div></div><div class="field full"><label>Adresse / lieu *</label><textarea name="address" required placeholder="Quartier, rue, repère, bâtiment…"></textarea></div><div class="field full"><label>Mode de paiement *</label><select name="payment_method">${payments}</select></div><div class="field full"><label>Note</label><textarea name="notes" placeholder="Précision pour le livreur (facultatif)"></textarea></div></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Confirmer la commande</button></form><aside class="summary"><h2>Votre commande</h2>${c.map(x=>`<p><strong>${x.quantity}×</strong> ${escapeHtml(x.name)}<br><span class="muted">${x.price==null?'Prix à confirmer':money(x.price*x.quantity)}</span></p>`).join('')}<hr><p><strong>Total articles : ${unknown?'À confirmer':money(total)}</strong></p>${fee?`<p class="muted">Livraison : ${money(fee)}${b.freeDeliveryFrom?` (gratuite dès ${money(b.freeDeliveryFrom)})`:''}</p>`:''}<div class="notice">Après enregistrement, vous recevrez un code de suivi à conserver.</div></aside></div>`;$('#orderForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.items=c.map(x=>({id:x.id,quantity:x.quantity}));const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok){showToast(d.error||'Impossible d’enregistrer la commande.');return}localStorage.removeItem('sl_cart');location.href='/suivi.html?code='+encodeURIComponent(d.code)}}
loadCheckout();
</script></body></html>
