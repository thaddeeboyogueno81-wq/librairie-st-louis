<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ae70"><meta property="og:site_name" content="Librairie Papeterie Saint Louis"><meta property="og:locale" content="fr_CM"><title>Suivi de commande | Saint Louis</title><meta name="description" content="Suivez votre commande de la Librairie Papeterie Saint Louis à Yaoundé."><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="loader" id="loader"><div class="loader-box"><img class="loader-logo" src="/assets/logo.svg"><div class="spinner"></div></div></div><div class="route-overlay" id="routeOverlay"><div class="spinner"></div></div><div class="toast" id="toast"></div>
<nav class="nav"><div class="container nav-inner"><a class="brand transition-link" href="/"><img src="/assets/logo.svg"></a><button class="menu-btn" id="menuBtn">☰</button><div class="navlinks" id="navLinks"><a class="transition-link" href="/">Accueil</a><a class="transition-link" href="/catalogue.html">Catalogue</a><a class="active transition-link" href="/suivi.html">Suivre une commande</a><a class="cart-pill transition-link" href="/panier.html">Panier <span class="count cart-count">0</span></a></div></div></nav>
<main><section class="page-head"><div class="container"><h1>Suivre ma commande</h1><p>Entrez le code reçu après votre commande.</p></div></section><section class="section" style="padding-top:20px"><div class="container"><div class="form-card" style="max-width:700px;margin:auto"><form id="trackForm"><div class="field"><label>Code de commande</label><input id="code" required placeholder="Ex. SL-20260914-ABC123"></div><button class="btn btn-primary" style="margin-top:14px">Rechercher</button></form><div id="result"></div></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:0;margin:0">Site réalisé par <strong>Thaddée Isaac Boyoguéno</strong>.</div></div></footer>
<a class="whatsapp-float" data-whatsapp="Bonjour, je souhaite avoir des informations sur vos produits." target="_blank" rel="noopener" aria-label="Contacter la librairie sur WhatsApp">WhatsApp</a><script src="/app.js"></script><script>
const labels=[["pending","Reçue"],["confirmed","Confirmée"],["preparing","Préparation"],["out_for_delivery","En livraison"],["delivered","Livrée"],["received","Reçue par vous"]];
async function track(code){const r=await fetch("/api/orders/"+encodeURIComponent(code));const d=await r.json();if(!r.ok){$("#result").innerHTML='<div class="notice" style="margin-top:20px">Commande introuvable.</div>';return}
const idx=labels.findIndex(x=>x[0]===d.status);$("#result").innerHTML=`<div class="notice" style="margin-top:20px"><strong>${escapeHtml(d.customer_name)}</strong><br>Commande <strong>${escapeHtml(d.code)}</strong><br>Statut : <strong>${formatStatus(d.status)}</strong></div><div class="status-track">${labels.map((x,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}">${x[1]}</div>`).join("")}</div><div class="cart-list"><h3>Articles</h3>${d.items.map(x=>`<p>${x.quantity}× ${escapeHtml(x.name)} — ${x.unit_price==null?'Prix à confirmer':money(x.unit_price*x.quantity)}</p>`).join("")}</div>${d.status==="delivered"?'<button class="btn btn-secondary" id="received" style="margin-top:18px">✓ J’ai reçu ma commande</button>':''}${d.status==="received"?'<div class="notice success">Merci ! La réception de votre commande a été confirmée.</div>':''}`;
$("#received")?.addEventListener("click",async()=>{await fetch("/api/orders/"+encodeURIComponent(d.code)+"/received",{method:"POST"});track(d.code)});
}
$("#trackForm").onsubmit=e=>{e.preventDefault();track($("#code").value.trim().toUpperCase())};const initial=new URLSearchParams(location.search).get("code");if(initial){$("#code").value=initial;track(initial)}
if(initial){setInterval(()=>track(initial),20000)}
</script></body></html>
