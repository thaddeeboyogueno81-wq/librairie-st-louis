<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9ae70"><meta property="og:site_name" content="Librairie Papeterie Saint Louis"><meta property="og:locale" content="fr_CM"><title>Panier | Saint Louis</title><meta name="description" content="Panier de commande de la Librairie Papeterie Saint Louis."><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="loader" id="loader"><div class="loader-box"><img class="loader-logo" src="/assets/logo.svg"><div class="spinner"></div></div></div><div class="route-overlay" id="routeOverlay"><div class="spinner"></div></div><div class="toast" id="toast"></div>
<nav class="nav"><div class="container nav-inner"><a class="brand transition-link" href="/"><img src="/assets/logo.svg"></a><button class="menu-btn" id="menuBtn">☰</button><div class="navlinks" id="navLinks"><a class="transition-link" href="/">Accueil</a><a class="transition-link" href="/catalogue.html">Catalogue</a><a class="transition-link" href="/suivi.html">Suivre une commande</a><a class="cart-pill active transition-link" href="/panier.html">Panier <span class="count cart-count">0</span></a></div></div></nav>
<main><section class="page-head"><div class="container"><h1>Votre panier</h1><p>Vérifiez vos articles avant de passer la commande.</p></div></section><section class="section" style="padding-top:20px"><div class="container"><div id="cartView"></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:0;margin:0">Site réalisé par <strong>Thaddée Isaac Boyoguéno</strong>.</div></div></footer>
<a class="whatsapp-float" data-whatsapp="Bonjour, je souhaite avoir des informations sur vos produits." target="_blank" rel="noopener" aria-label="Contacter la librairie sur WhatsApp">WhatsApp</a><script src="/app.js"></script><script>
function renderCart(){const c=cart(),box=$("#cartView");if(!c.length){box.innerHTML='<div class="empty"><h3>Votre panier est vide</h3><p>Ajoutez des articles depuis le catalogue.</p><a class="btn btn-secondary transition-link" href="/catalogue.html">Explorer le catalogue</a></div>';return}
let total=0,unknown=false;c.forEach(x=>{if(x.price==null)unknown=true;else total+=x.price*x.quantity});
box.innerHTML=`<div class="cart-layout"><div class="cart-list"><h2>Articles</h2>${c.map(x=>`<div class="cart-row"><img src="${x.image}" alt=""><div><strong>${escapeHtml(x.name)}</strong><div class="muted">${escapeHtml(x.category)}</div><div class="qty"><button data-dec="${x.id}">−</button><b>${x.quantity}</b><button data-inc="${x.id}">+</button></div></div><div><strong>${x.price==null?'À confirmer':money(x.price*x.quantity)}</strong><br><button class="remove" data-del="${x.id}">Supprimer</button></div></div>`).join("")}</div><aside class="summary"><h2>Résumé</h2><p class="muted">${c.length} article(s)</p><p><strong>Total : </strong>${unknown?'À confirmer par la librairie':money(total)}</p>${unknown?'<div class="notice">Certains tarifs ne sont pas encore renseignés. La librairie pourra confirmer le montant final après réception.</div>':''}<a class="btn btn-primary" style="width:100%" href="/commande.html">Passer la commande →</a></aside></div>`;
$$("[data-inc]").forEach(b=>b.onclick=()=>change(b.dataset.inc,1));$$("[data-dec]").forEach(b=>b.onclick=()=>change(b.dataset.dec,-1));$$("[data-del]").forEach(b=>b.onclick=()=>remove(b.dataset.del));
}
function change(id,n){const c=cart(),x=c.find(x=>x.id==id);if(x){x.quantity=Math.max(1,x.quantity+n);saveCart(c);renderCart()}}
function remove(id){saveCart(cart().filter(x=>x.id!=id));renderCart()}
renderCart();
</script></body></html>
